# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: validate
permissions:
  contents: read
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  renovate-config:
    name: validate-renovate-config
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/renovatebot/renovate:44.164.6-full@sha256:de0a2f27db5323570c14eee2fa613f3d9e01156c0d4888daa6af665de0634b5e
      options: --user 0
    defaults:
      run:
        shell: bash
    env:
      BASH_ENV: /usr/local/etc/env
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Validate Renovate configuration files
        run: |
          renovate-config-validator --strict \
            default.json \
            automerge.json \
            gitmoji.json \
            conventional.json \
            .renovaterc.json5 \
            .github/renovate-config.js
      - name: Check commit style defaults and overrides
        run: /usr/local/renovate/node --test .github/renovate-config.test.cjs .github/tests/*.test.mjs
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Run actionlint
        uses: reviewdog/action-actionlint@ae857e78c1b42b3d0a49637181b09d3d56d402b4 # v1.84.1
        with:
          fail_level: error
