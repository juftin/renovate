# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: validate
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  renovate-config:
    name: validate-renovate-config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.2
      - name: Validate Renovate configuration files
        run: |
          # renovate: datasource=github-releases depName=renovatebot/renovate
          RENOVATE_VERSION=44.222.1
          npx --yes --package "renovate@${RENOVATE_VERSION}" -- renovate-config-validator --strict \
            default.json \
            automerge.json \
            gitmoji.json \
            conventional.json \
            .renovaterc.json5 \
            .github/renovate-config.js
      - name: Check commit style defaults and overrides
        run: node --test .github/renovate-config.test.cjs
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Run actionlint
        uses: reviewdog/action-actionlint@619a81ec64ff8c0211cd6146eb2b21e8f1d7f440 # v1.81.1
        with:
          fail_level: error
