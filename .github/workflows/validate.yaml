# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: validate
permissions:
  contents: read
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  renovate-config:
    name: validate-renovate-config
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/renovatebot/renovate:44.257.6-full@sha256:28d0873a8abdebeb005ecd59e63e1ab028633011ef6aa1d4899a89815aab0b35
      options: --user 0
    defaults:
      run:
        shell: bash
    env:
      BASH_ENV: /usr/local/etc/env
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Validate Renovate configuration files
        run: |
          renovate-config-validator --strict \
            default.json \
            automerge.json \
            gitmoji.json \
            conventional.json \
            .renovaterc.json5 \
            .github/renovate-config.js
      - name: Check commit style defaults and overrides
        run: /usr/local/renovate/node --test .github/renovate-config.test.cjs .github/tests/*.test.mjs
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Run actionlint
        uses: reviewdog/action-actionlint@7abf25e1607ec65838b73d0484ff31f8e9499d80 # v1.81.2
        with:
          fail_level: error
