# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: renovate
on:
  workflow_dispatch:
    inputs:
      repository:
        description: "Target repository (e.g. juftin/camply). Leave blank to autodiscover all repos with the topic."
        required: false
        type: string
      dry_run:
        description: "Dry-run mode (null, extract, lookup, full)"
        required: false
        default: "null"
        type: choice
        options:
          - "null"
          - "extract"
          - "lookup"
          - "full"
      log_level:
        description: "Renovate log level"
        required: false
        default: "info"
        type: choice
        options:
          - trace
          - debug
          - info
          - warn
          - error
      repo_cache:
        description: "Repository cache strategy"
        required: false
        default: "enabled"
        type: choice
        options:
          - enabled
          - disabled
          - reset
  schedule:
    - cron: "0/30 * * * *"
  push:
    branches:
      - main
    paths:
      - .github/workflows/renovate.yaml
      - .github/renovate-config.js
      - .renovaterc.json5
      - default.json
      - automerge.json
concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.repository || 'autodiscover' }}
  cancel-in-progress: false
env:
  cache_dir: /tmp/renovate/cache/renovate/repository
  cache_key: renovate-cache
jobs:
  renovate:
    name: renovate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Generate Renovate App Token
        id: app-token
        env:
          APP_ID: ${{ secrets.RENOVATE_APP_ID || secrets.APP_ID }}
          APP_KEY: ${{ secrets.RENOVATE_APP_PRIVATE_KEY || secrets.APP_PRIVATE_KEY }}
        if: ${{ env.APP_ID != '' && env.APP_KEY != '' }}
        uses: actions/create-github-app-token@c1a285145b9d317df6ced56c09f525b5c2b6f755 # v1.11.1
        with:
          app-id: ${{ env.APP_ID }}
          private-key: ${{ env.APP_KEY }}
          owner: ${{ github.repository_owner }}
      - name: Restore Renovate cache
        id: cache-restore
        if: ${{ github.event.inputs.repo_cache != 'disabled' && github.event.inputs.repo_cache != 'reset' }}
        uses: actions/cache/restore@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ${{ env.cache_dir }}
          key: ${{ env.cache_key }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ env.cache_key }}-
      - name: Fix restored cache permissions
        if: ${{ steps.cache-restore.outputs.cache-matched-key != '' }}
        run: |
          sudo chown -R 12021:0 /tmp/renovate/
      - name: Run Renovate
        uses: renovatebot/github-action@f0f41e5f2e706165f6814b1d0f0d0e319de7d1d9 # v46.3.8
        with:
          token: ${{ steps.app-token.outputs.token || secrets.APP_TOKEN || secrets.RENOVATE_TOKEN || github.token }}
          configurationFile: .github/renovate-config.js
          # renovate: datasource=github-releases depName=renovatebot/renovate
          renovate-version: 44.161.1
        env:
          LOG_LEVEL: ${{ github.event.inputs.log_level || 'info' }}
          RENOVATE_DRY_RUN: ${{ github.event.inputs.dry_run != 'null' && github.event.inputs.dry_run || '' }}
          RENOVATE_REPOSITORY: ${{ github.event.inputs.repository || '' }}
          RENOVATE_REPOSITORY_CACHE: ${{ github.event.inputs.repo_cache || 'enabled' }}
          RENOVATE_AUTODISCOVER_FILTER: ${{ vars.RENOVATE_AUTODISCOVER_FILTER || format('["{0}/*"]', github.repository_owner) }}
          RENOVATE_DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          RENOVATE_DOCKER_PASSWORD: ${{ secrets.DOCKER_TOKEN }}
      - name: Save Renovate cache
        if: ${{ always() && github.event.inputs.repo_cache != 'disabled' && steps.cache-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ${{ env.cache_dir }}
          key: ${{ env.cache_key }}-${{ github.run_id }}-${{ github.run_attempt }}
